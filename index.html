const REF=`mov|MOV dst, src|Copies src into dst. Sizes must match.|none|writes dst if memory|mov eax, [x]
add/adc|ADD dst, src|dst = dst + src (ADC adds carry too).|CF OF SF ZF PF AF|writes dst|add eax, 5
sub/sbb|SUB dst, src|dst = dst − src (SBB subtracts borrow too).|CF OF SF ZF PF AF|writes dst|sub ecx, 1
inc/dec|INC dst|Adds/subtracts 1; CF is preserved.|OF SF ZF PF AF|writes dst|inc esi
neg|NEG dst|Two's complement negate.|CF OF SF ZF PF AF|writes dst|neg eax
mul|MUL src|Unsigned multiply: EDX:EAX = EAX × src (AX=AL×src for bytes).|CF=OF=1 if upper half nonzero|none|mul ecx
imul|IMUL src | dst,src | dst,src,imm|Signed multiply.|CF=OF=1 if result truncated|none|imul eax, ebx, 3
div|DIV src|Unsigned EDX:EAX ÷ src → EAX quotient, EDX remainder. Divisor 0 raises #DE.|undefined|none|xor edx,edx / div ecx
idiv|IDIV src|Signed divide; use CDQ first to sign-extend EAX into EDX.|undefined|none|cdq / idiv ecx
cdq|CDQ|Sign-extends EAX into EDX.|none|none|cdq
cmp|CMP a, b|Computes a − b, discards result, sets flags.|CF OF SF ZF PF AF|none|cmp eax, 10
test|TEST a, b|a AND b, discards result.|SF ZF PF (CF=OF=0)|none|test eax, eax
and/or/xor|AND dst, src|Bitwise logic; CF=OF=0.|SF ZF PF|writes dst|xor eax, eax
not|NOT dst|Flips every bit.|none|writes dst|not eax
shl/sal|SHL dst, n|Shift left; last bit out goes to CF. x << n = x·2ⁿ.|CF OF SF ZF PF|writes dst|shl eax, 2
shr|SHR dst, n|Logical shift right (zero fill).|CF OF SF ZF PF|writes dst|shr eax, 1
sar|SAR dst, n|Arithmetic shift right (keeps sign bit).|CF SF ZF PF|writes dst|sar eax, 1
rol/ror|ROL dst, n|Rotate bits; bit shifted out re-enters on the other side.|CF OF|writes dst|rol al, 1
push|PUSH src|ESP −= 4, then stores src at [ESP].|none|writes stack|push eax
pop|POP dst|Loads [ESP] into dst, then ESP += 4.|none|reads stack|pop ebx
call|CALL label|Pushes return address, jumps to label.|none|writes stack|call fact
ret|RET|Pops return address into EIP.|none|reads stack|ret
jmp|JMP label|Unconditional jump.|none|none|jmp .loop
je/jz|JE label|Jump if ZF=1 (equal / zero).|reads ZF|none|je done
jne/jnz|JNE label|Jump if ZF=0.|reads ZF|none|jne again
jg/jnle/jge/jnl/jl/jnge/jle/jng|JG label|Signed compares using ZF, SF, OF.|reads ZF SF OF|none|jl .row
ja/jnbe/jae/jnb/jnc/jb/jnae/jc/jbe/jna|JA label|Unsigned compares using CF, ZF.|reads CF ZF|none|jbe .base
js/jns/jo/jno/jp/jnp|JS label|Jump on a single flag.|reads flag|none|js neg
loop|LOOP label|ECX −= 1; jump if ECX ≠ 0.|none|none|loop next
lea|LEA r, [mem]|Loads the address of mem (no memory access).|none|none|lea esi, [arr+4]
xchg|XCHG a, b|Swaps two operands.|none|writes both|xchg eax, ebx
movzx/movsx|MOVZX r, src|Widens with zero / sign extension.|none|reads src|movzx eax, byte [x]
leave|LEAVE|ESP = EBP; pop EBP.|none|reads stack|leave

int|INT 0x80|Linux syscall: EAX=1 exit(EBX), 3 read(EBX,ECX,EDX), 4 write(EBX=1,ECX=buf,EDX=len).|none|reads/writes buffer|int 0x80`.split('\n').map(l=>l.split('|'));

$('bA').onclick=build;$('bR').onclick=run;$('bP').onclick=()=>{if(st=='running'){st='paused';refresh()}};$('bI').onclick=()=>step(0);$('bO').onclick=()=>step(1);
$('bS').onclick=()=>{if(st=='running'||st=='paused'){st='halted';outS+='\n[stopped by user]\n';refresh()}};$('bX').onclick=()=>{st='idle';build()};$('bY').onclick=()=>{st='idle';if(build())run()};
$('bCl').onclick=()=>{outS='';refresh()};$('bCb').onclick=()=>{bps.clear();refresh()};
$('gu').onclick=e=>{const l=+e.target.dataset.l;if(l){bps.has(l)?bps.delete(l):bps.add(l);refresh()}};
$('ed').oninput=()=>{if(st!='running'){st='idle';errs=[]}edr();pill();try{localStorage.setItem('coal.cur',$('ed').value)}catch{}};$('ed').onscroll=syncS;
$('ed').onkeydown=e=>{if(e.key=='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}};
const sv_=()=>{try{return JSON.parse(localStorage.getItem('coal.saved')||'{}')}catch{return{}}},lst=()=>{$('svs').innerHTML=Object.keys(sv_()).map(k=>`<option>${esc(k)}</option>`).join('')||'<option>(none saved)</option>'};
$('bSv').onclick=()=>{try{const o=sv_(),n=$('pn').value.trim()||'untitled';o[n]=$('ed').value;localStorage.setItem('coal.saved',JSON.stringify(o));lst();outS+=`\n[saved "${n}"]\n`;refresh()}catch{outS+='\n[storage unavailable]\n';refresh()}};
$('bLd').onclick=()=>{const v=sv_()[$('svs').value];if(v!=null){$('ed').value=v;$('ed').oninput()}};
$('bCp').onclick=async()=>{try{await navigator.clipboard.writeText($('ed').value);outS+='\n[copied]\n'}catch{$('ed').select();outS+='\n[select-all done — press Ctrl+C]\n'}refresh()};
$('bIm').onclick=()=>$('fi').click();$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('ed').value=r.result;$('ed').oninput()};r.readAsText(f)};
$('bEx').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('ed').value],{type:'text/plain'}));a.download=($('pn').value||'program')+'.asm';a.click()};
$('bT').onclick=()=>{const r=document.documentElement,t=r.dataset.theme=='navy'?'bordeaux':'navy';r.dataset.theme=t;try{localStorage.setItem('coal.theme',t)}catch{}};
document.addEventListener('keydown',e=>{const m={F5:run,F10:()=>step(1),F11:()=>step(0),Escape:()=>$('bP').click()};if(m[e.key]){e.preventDefault();m[e.key]()}else if(e.ctrlKey&&e.key=='Enter'){e.preventDefault();build()}else if(e.key=='F9'){e.preventDefault();const l=$('ed').value.slice(0,$('ed').selectionStart).split('\n').length;bps.has(l)?bps.delete(l):bps.add(l);refresh()}});

lst();refresh();
